<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DostiBook - Facebook Jaisa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
.header{background:#1877f2;color:#fff;padding:12px;text-align:center;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:10}
.container{max-width:500px;margin:auto;padding:10px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px;outline:none}
button{background:#1877f2;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:5px}
button.gray{background:#e4e6eb;color:#000}
.story-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}
.story{ min-width:90px;height:140px;border-radius:10px;overflow:hidden;position:relative;background:#ddd;cursor:pointer}
.story img{width:100%;height:100%;object-fit:cover}
.story span{position:absolute;bottom:5px;left:5px;color:#fff;font-size:12px;font-weight:bold;text-shadow:1px 1px 2px #000}
.post-img{width:100%;border-radius:8px;margin-top:8px;max-height:400px;object-fit:cover}
.post-head{font-weight:bold;margin-bottom:5px}
.time{font-size:11px;color:gray;font-weight:normal}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.comment-box{display:flex;gap:5px;margin-top:10px}
.comment-box input{margin:0}
.comment-box button{width:80px;margin:0}
.one-comment{background:#f0f2f5;padding:6px 10px;border-radius:10px;margin-top:6px;font-size:14px}
.name-row{display:flex;gap:8px}
.name-row input{flex:1}
</style>
</head>
<body>
<div class="header">DostiBook ❤️</div>
<div class="container">

<div class="card">
<div class="name-row">
<input id="myName" placeholder="Tera Naam likh - jaise Sahil" value="Sahil Kahn">
</div>
<h3>Story Lagao 📸</h3>
<input type="file" id="storyFile" accept="image/*">
<button onclick="addStory()">Story Lagao</button>
<div class="story-row" id="storyRow"></div>
</div>

<div class="card">
<h3>Kya Soch Rahe Ho? 🤔</h3>
<textarea id="postText" rows="2" placeholder="Aaj kya masti hui?"></textarea>
<input type="file" id="postFile" accept="image/*">
<button onclick="addPost()">Post Karo 🚀</button>
</div>

<div id="postList"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCchg5W7COWvlWbLyWuYzvPhu9j6Sy8qTo",
  authDomain: "dostibook-7c5de.firebaseapp.com",
  projectId: "dostibook-7c5de",
  storageBucket: "dostibook-7c5de.firebasestorage.app",
  messagingSenderId: "581938722841",
  appId: "1:581938722841:web:033a55b0923f87b0fd9288",
  measurementId: "G-FXNSNH88MD"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// Naam save rakho
let savedName = localStorage.getItem('dostiName');
if(savedName) document.getElementById('myName').value = savedName;
document.getElementById('myName').onchange = e => localStorage.setItem('dostiName', e.target.value);

function getName(){ return document.getElementById('myName').value || 'Dost'; }

async function uploadImage(file, folder){
  const ref = storage.ref(folder + '/' + Date.now() + '_' + file.name);
  await ref.put(file);
  return await ref.getDownloadURL();
}

// POST
async function addPost(){
  let text = document.getElementById('postText').value.trim();
  let file = document.getElementById('postFile').files[0];
  if(!text && !file) return alert('Kuch to likh ya photo chun!');
  let imgUrl = '';
  if(file) imgUrl = await uploadImage(file, 'posts');
  await db.collection('posts').add({name:getName(), text:text, img:imgUrl, likes:0, time:Date.now(), date:new Date().toLocaleString('hi-IN')});
  document.getElementById('postText').value='';
  document.getElementById('postFile').value='';
  alert('Post ho gaya!');
}

// STORY
async function addStory(){
  let file = document.getElementById('storyFile').files[0];
  if(!file) return alert('Pehle photo chun!');
  let imgUrl = await uploadImage(file, 'stories');
  await db.collection('stories').add({name:getName(), img:imgUrl, time:Date.now()});
  document.getElementById('storyFile').value='';
  alert('Story lag gayi!');
}

// POSTS DIKHAO - SABKO DIKHEGA
db.collection('posts').orderBy('time','desc').onSnapshot(snap=>{
  let html='';
  snap.forEach(doc=>{
    let p=doc.data(); let id=doc.id;
    html += `<div class="card"><div class="post-head">${p.name} <span class="time">• ${p.date||''}</span></div>
    <div>${p.text||''}</div>
    ${p.img?`<img class="post-img" src="${p.img}">`:''}
    <div class="actions">
      <button onclick="likePost('${id}',${p.likes||0})">❤️ Like (${p.likes||0})</button>
      <button class="gray" onclick="deletePost('${id}')">🗑️ Delete</button>
    </div>
    <div id="comments-${id}"></div>
    <div class="comment-box"><input id="c-${id}" placeholder="Comment likho..."><button onclick="addComment('${id}')">Send</button></div>
    </div>`;
    loadComments(id);
  });
  document.getElementById('postList').innerHTML = html || '<p style="text-align:center;color:gray">Abhi koi post nahi hai, pehla post karo!</p>';
});

function likePost(id, likes){ db.collection('posts').doc(id).update({likes:likes+1}); }
function deletePost(id){ if(confirm('Delete kare?')) db.collection('posts').doc(id).delete(); }

async function addComment(postId){
  let inp = document.getElementById('c-'+postId);
  if(!inp.value.trim()) return;
  await db.collection('posts').doc(postId).collection('comments').add({name:getName(), text:inp.value, time:Date.now()});
  inp.value='';
}
function loadComments(postId){
  db.collection('posts').doc(postId).collection('comments').orderBy('time','asc').onSnapshot(s=>{
    let h='';
    s.forEach(d=>{ let c=d.data(); h+=`<div class="one-comment"><b>${c.name}:</b> ${c.text}</div>`; });
    let el=document.getElementById('comments-'+postId);
    if(el) el.innerHTML=h;
  });
}

// STORIES DIKHAO
db.collection('stories').orderBy('time','desc').onSnapshot(snap=>{
  let h='';
  snap.forEach(doc=>{ let s=doc.data(); h+=`<div class="story" onclick="window.open('${s.img}','_blank')"><img src="${s.img}"><span>${s.name}</span></div>`; });
  document.getElementById('storyRow').innerHTML = h || '<p style="color:gray;font-size:13px">Koi story nahi hai</p>';
});
</script>
</body>
</html>
