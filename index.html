<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DostiBook - Facebook Jaisa App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f2f5}
.top{background:#1877f2;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.top b{font-size:22px}.top input{flex:1;padding:8px;border-radius:20px;border:0;outline:none}
.dp{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fff;cursor:pointer;border:2px solid #fff}
.wrap{max-width:520px;margin:auto;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:10px;align-items:center}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;outline:none;margin-top:8px}
.btn{background:#1877f2;color:#fff;border:0;padding:10px 14px;border-radius:20px;font-weight:bold;width:100%;margin-top:8px;cursor:pointer}
.btn2{background:#e4e6eb;color:#000}
.postimg{width:100%;border-radius:10px;margin-top:10px;max-height:380px;object-fit:cover}
.actions{display:flex;gap:6px;margin-top:10px}.actions button{flex:1;padding:8px;border:0;border-radius:20px;background:#f0f2f5;cursor:pointer;font-weight:bold}
.friend{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee}.friend img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.friend button{margin-left:auto;background:#1877f2;color:#fff;border:0;padding:7px 12px;border-radius:20px;font-weight:bold}
.comment{background:#f0f2f5;padding:7px 10px;border-radius:12px;margin-top:6px;font-size:14px}
.tabs{display:flex;gap:6px}.tabs button{flex:1}
.hidden{display:none}
</style></head>
<body>
<div class="top"><b>DostiBook</b><input id="search" placeholder="Search दोस्त... 🔍"><label><img id="myDP" class="dp" src="https://i.pravatar.cc/100?img=12"><input type="file" accept="image/*" hidden onchange="setDP(event)"></label></div>
<div class="wrap">
<div class="card"><div class="tabs"><button class="btn" onclick="showTab('home')">🏠 Home</button><button class="btn btn2" onclick="showTab('friends')">👥 Friends</button><button class="btn btn2" onclick="showTab('profile')">👤 Profile</button></div></div>
<div id="homeTab">
<div class="card"><div class="row"><img id="myDP2" class="dp" src="https://i.pravatar.cc/100?img=12"><b id="myName">Sahil Kahn</b></div>
<textarea id="postText" placeholder="आपके मन में क्या है, Sahil?"></textarea>
<input type="file" id="postPhoto" accept="image/*"><img id="preview" class="postimg hidden">
<button class="btn" onclick="addPost()">📝 DostiBook पर पोस्ट करें</button></div>
<div id="posts"></div>
</div>
<div id="friendsTab" class="hidden"><div class="card"><h3>👥 Friend Requests</h3><div id="requests"></div><h3>✅ My Friends (<span id="fcount">0</span>)</h3><div id="myFriends"></div></div></div>
<div id="profileTab" class="hidden"><div class="card" style="text-align:center"><label><img id="myDP3" class="dp" style="width:100px;height:100px" src="https://i.pravatar.cc/100?img=12"><br><small>DP बदलने के लिए फोटो पर दबाओ</small><input type="file" accept="image/*" hidden onchange="setDP(event)"></label><h2 id="myName2">Sahil Kahn</h2><p>📍 Pokaran, Rajasthan • 👥 <span id="fcount2">0</span> Friends</p><input id="nameInput" placeholder="अपना नाम बदलो"><button class="btn" onclick="saveName()">नाम Save करो</button></div></div>
</div>
<script>
let friends=[{name:"Rahul Sharma",img:"https://i.pravatar.cc/100?img=13"},{name:"Priya Singh",img:"https://i.pravatar.cc/100?img=47"},{name:"Amit Kumar",img:"https://i.pravatar.cc/100?img=33"},{name:"Neha Verma",img:"https://i.pravatar.cc/100?img=44"},{name:"Vikash Yadav",img:"https://i.pravatar.cc/100?img=59"}];
let myFriends=[];let posts=JSON.parse(localStorage.getItem('db_posts')||'[]');let myDP=localStorage.getItem('db_dp')||"https://i.pravatar.cc/100?img=12";let myName=localStorage.getItem('db_name')||"Sahil Kahn";
function save(){localStorage.setItem('db_posts',JSON.stringify(posts));localStorage.setItem('db_dp',myDP);localStorage.setItem('db_name',myName);}
function showTab(t){['home','friends','profile'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('hidden',x!==t));}
function setDP(e){let r=new FileReader();r.onload=()=>{myDP=r.result;document.querySelectorAll('#myDP,#myDP2,#myDP3').forEach(i=>i.src=myDP);save();};r.readAsDataURL(e.target.files[0]);}
function saveName(){myName=document.getElementById('nameInput').value||myName;document.getElementById('myName').textContent=myName;document.getElementById('myName2').textContent=myName;save();alert('नाम Save हो गया!')}
document.getElementById('postPhoto').onchange=e=>{let r=new FileReader();r.onload=()=>{let p=document.getElementById('preview');p.src=r.result;p.classList.remove('hidden');p.dataset.img=r.result;};r.readAsDataURL(e.target.files[0]);};
function addPost(){let t=document.getElementById('postText').value;let img=document.getElementById('preview').dataset.img||"";if(!t&&!img)return alert('कुछ लिखो या फोटो चुनो');posts.unshift({name:myName,dp:myDP,text:t,img:img,likes:0,liked:false,comments:[],time:new Date().toLocaleString('hi-IN')});document.getElementById('postText').value="";document.getElementById('preview').classList.add('hidden');document.getElementById('preview').dataset.img="";save();renderPosts();}
function renderPosts(){document.getElementById('posts').innerHTML=posts.map((p,i)=>`<div class="card"><div class="row"><img class="dp" src="${p.dp}"><div><b>${p.name}</b><br><small>${p.time}</small></div></div>${p.text?`<p>${p.text}</p>`:''}${p.img?`<img class="postimg" src="${p.img}">`:''}<div class="actions"><button onclick="like(${i})">${p.liked?'❤️':'🤍'} Like (${p.likes})</button><button onclick="document.getElementById('c${i}').focus()">💬 Comment (${p.comments.length})</button><button onclick="sharePost(${i})">↗️ Share</button></div><div>${p.comments.map(c=>`<div class="comment"><b>${c.n}:</b> ${c.t}</div>`).join('')}</div><div class="row"><input id="c${i}" placeholder="कमेंट लिखो..."><button style="width:70px" class="btn" onclick="addComment(${i})">Send</button></div></div>`).join('')||'<div class="card">अभी कोई पोस्ट नहीं है। पहली पोस्ट करो!</div>';}
function like(i){posts[i].liked=!posts[i].liked;posts[i].likes+=posts[i].liked?1:-1;save();renderPosts();}
function addComment(i){let v=document.getElementById('c'+i).value;if(!v)return;posts[i].comments.push({n:myName,t:v});save();renderPosts();}
function sharePost(i){navigator.clipboard?.writeText(location.href);alert('लिंक Copy हो गया! दोस्तों को भेज दो');}
function renderFriends(){document.getElementById('requests').innerHTML=friends.map((f,i)=>`<div class="friend"><img src="${f.img}"><b>${f.name}</b><button onclick="accept(${i})">Accept</button><button style="background:#e4e6eb;color:#000" onclick="reject(${i})">Delete</button></div>`).join('')||'कोई Request नहीं है';document.getElementById('myFriends').innerHTML=myFriends.map(f=>`<div class="friend"><img src="${f.img}"><b>${f.name}</b><span style="margin-left:auto">✅ Friend</span></div>`).join('')||'अभी कोई Friend नहीं है';document.getElementById('fcount').textContent=myFriends.length;document.getElementById('fcount2').textContent=myFriends.length;}
function accept(i){myFriends.push(friends[i]);friends.splice(i,1);renderFriends();alert('Friend बन गया! 🎉');}
function reject(i){friends.splice(i,1);renderFriends();}
document.querySelectorAll('#myDP,#myDP2,#myDP3').forEach(i=>i.src=myDP);document.getElementById('myName').textContent=myName;document.getElementById('myName2').textContent=myName;renderPosts();renderFriends();
</script></body></html>
