<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DostiBook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f8f8f8;padding-bottom:90px}
.top{background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.top h1{font-size:26px;background:linear-gradient(135deg,#FF3D68,#FF8A00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#fff;margin:12px;padding:14px;border-radius:16px}
.card input,.card textarea{width:100%;padding:11px;border:1px solid #eee;border-radius:12px;margin:6px 0;outline:none;font-size:15px}
.btn{background:linear-gradient(135deg,#FF3D68,#FF8A00);color:#fff;border:none;padding:11px;border-radius:12px;font-weight:700;width:100%;cursor:pointer}
.btn2{background:#111;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.profile{display:flex;gap:12px;align-items:center}
.profile img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #FF3D68;background:#eee}
.stories{display:flex;gap:12px;overflow-x:auto;padding:8px 2px}
.story{flex:0 0 72px;text-align:center}
.story img,.story video{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #FF8A00;background:#eee}
.post-img{width:100%;border-radius:14px;margin-top:10px;max-height:340px;object-fit:cover}
.bottom{position:fixed;bottom:12px;left:12px;right:12px;background:#fff;display:flex;justify-content:space-around;padding:12px;border-radius:30px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.bottom button{border:none;background:none;font-size:22px}
.hidden{display:none}
.filebox{position:relative;display:inline-block;background:#FFF0F3;color:#FF3D68;padding:9px 14px;border-radius:20px;font-weight:700;font-size:14px;border:1px solid #FFD9E2;cursor:pointer}
.filebox input{position:absolute;left:0;top:0;opacity:0;width:100%;height:100%}
.reel{margin:12px;background:#000;border-radius:16px;overflow:hidden;color:#fff}
.reel video,.reel img{width:100%;max-height:480px;object-fit:cover;display:block}
.friend{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f2f2f2}
.friend img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#eee}
</style>
</head>
<body>
<div id="loginPage"><div style="padding:30px 20px;text-align:center"><h1 style="font-size:36px;color:#FF3D68">DostiBook</h1><p style="color:#888">Apni Duniya • Apne Log</p><div class="card" style="text-align:left"><h3 id="loginTitle">Login Karo</h3><div id="signupFields" class="hidden"><input id="regName" placeholder="Apna Naam"></div><input id="loginPhone" placeholder="Mobile Number"><input id="loginPass" type="password" placeholder="Password"><button class="btn" onclick="doLogin()" id="loginBtn">Login</button><p style="text-align:center;margin-top:12px"><span id="toggleText">Naya ho? </span><b style="color:#FF3D68" onclick="toggleLogin()" id="toggleBtn">Account Banao</b></p></div></div></div>
<div id="mainApp" class="hidden">
<div class="top"><h1>DostiBook</h1><b id="helloName"></b></div>
<div id="page-home">
<div class="card"><div class="profile"><label class="filebox" style="border-radius:50%;padding:0;border:none;background:none"><img id="myPic" src="https://via.placeholder.com/150/FF3D68/fff?text=You"><input type="file" accept="image/*" onchange="changeProfile(event)"></label><div style="flex:1"><b id="myName">Sahil Kahn</b><br><span id="myBio" style="font-size:12px;color:#888">DostiBook • Jodhpur</span></div><button class="btn2" onclick="editProfile()">Edit</button></div></div>
<div class="card"><b>Stories</b><div class="stories" id="storyList"></div><label class="filebox">+ Story Me Photo / Video Daalo<input type="file" accept="image/*,video/*" onchange="addStory(event)"></label></div>
<div class="card"><textarea id="postText" rows="3" placeholder="Aaj kya masti hui?"></textarea><img id="postPreview" class="post-img hidden"><div style="display:flex;justify-content:space-between;margin-top:8px"><label class="filebox">Photo Chuno<input type="file" accept="image/*" onchange="previewPost(event)"></label><button class="btn2" onclick="addPost()">Post Karo</button></div><p id="postStatus" style="font-size:12px;color:green"></p></div>
<div id="postFeed"></div>
</div>
<div id="page-reels" class="hidden"><div class="card"><h3>Reels</h3><label class="filebox">+ Reel Video Daalo<input type="file" accept="video/*" onchange="addReel(event)"></label></div><div id="reelFeed"></div></div>
<div id="page-dost" class="hidden"><div class="card"><h3>Mere Dost (<span id="friendCount">0</span>)</h3><input id="newFriendName" placeholder="Dost ka naam"><input id="newFriendCity" placeholder="City"><button class="btn" onclick="addFriend()">+ Dost Jodo</button><div id="friendList"></div><button class="btn" style="margin-top:12px;background:#25D366" onclick="shareApp()">WhatsApp Share</button></div></div>
<div id="page-profile" class="hidden"><div class="card" style="text-align:center"><img id="myPic2" src="https://via.placeholder.com/150/FF3D68/fff?text=You" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #FF3D68"><h2 id="myName2">Sahil Kahn</h2><p id="myBio2" style="color:#888">DostiBook • Jodhpur</p><p id="myPhoneShow"></p><button class="btn" style="margin-top:10px;background:#111" onclick="editProfile()">Naam / Bio Badlo</button><button class="btn" style="margin-top:10px;background:red" onclick="doLogout()">Logout</button></div></div>
<div class="bottom"><button onclick="showPage('home')">🏠</button><button onclick="showPage('reels')">🎬</button><button onclick="showPage('dost')">👥</button><button onclick="showPage('profile')">👤</button></div>
</div>
<script>
let isSignup=false;
function toggleLogin(){isSignup=!isSignup;document.getElementById('signupFields').classList.toggle('hidden',!isSignup);document.getElementById('loginTitle').innerText=isSignup?'Naya Account Banao':'Login Karo';document.getElementById('loginBtn').innerText=isSignup?'Account Banao':'Login';document.getElementById('toggleText').innerText=isSignup?'Pehle se account hai? ':'Naya ho? ';document.getElementById('toggleBtn').innerText=isSignup?'Login Karo':'Account Banao';}
function doLogin(){let phone=document.getElementById('loginPhone').value.trim();let pass=document.getElementById('loginPass').value.trim();if(!phone||!pass){alert('Mobile aur Password daalo');return;}let users=JSON.parse(localStorage.getItem('db_users')||'{}');if(isSignup){let name=document.getElementById('regName').value.trim();if(!name){alert('Naam daalo');return;}if(users[phone]){alert('Pehle se account hai');return;}users[phone]={name:name,phone:phone,pass:pass};localStorage.setItem('db_users',JSON.stringify(users));localStorage.setItem('db_current',phone);alert('Account Ban Gaya!');startApp();}else{if(!users[phone]){alert('Account nahi mila, pehle Account Banao dabao');return;}if(users[phone].pass!==pass){alert('Password galat');return;}localStorage.setItem('db_current',phone);startApp();}}
function doLogout(){localStorage.removeItem('db_current');location.reload();}
function startApp(){let phone=localStorage.getItem('db_current');if(!phone)return;let users=JSON.parse(localStorage.getItem('db_users')||'{}');let me=users[phone];if(!me)return;document.getElementById('loginPage').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');document.getElementById('helloName').innerText=me.name;window.myPhone=phone;window.myName=localStorage.getItem('db_name_'+phone)||me.name;window.myBio=localStorage.getItem('db_bio_'+phone)||'DostiBook • Jodhpur';document.getElementById('myName').innerText=window.myName;document.getElementById('myName2').innerText=window.myName;document.getElementById('myBio').innerText=window.myBio;document.getElementById('myBio2').innerText=window.myBio;document.getElementById('myPhoneShow').innerText='📱 '+phone;let pic=localStorage.getItem('db_pic_'+phone);if(pic){document.getElementById('myPic').src=pic;document.getElementById('myPic2').src=pic;}loadData();}
function loadData(){window.stories=JSON.parse(localStorage.getItem('db_stories_'+window.myPhone)||'[]');window.posts=JSON.parse(localStorage.getItem('db_posts_'+window.myPhone)||'[]');window.friends=JSON.parse(localStorage.getItem('db_friends_'+window.myPhone)||'[]');window.reels=JSON.parse(localStorage.getItem('db_reels_'+window.myPhone)||'[]');renderStories();renderPosts();renderFriends();renderReels();}
function showPage(p){['home','reels','dost','profile'].forEach(x=>document.getElementById('page-'+x).classList.add('hidden'));document.getElementById('page-'+p).classList.remove('hidden');window.scrollTo(0,0);}
function compressImage(file,cb){let r=new FileReader();r.onload=function(e){let img=new Image();img.onload=function(){let c=document.createElement('canvas');let w=img.width,h=img.height;if(w>800){h=h*800/w;w=800;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.7));};img.src=e.target.result;};r.readAsDataURL(file);}
function changeProfile(e){let f=e.target.files[0];if(!f)return;compressImage(f,function(url){document.getElementById('myPic').src=url;document.getElementById('myPic2').src=url;try{localStorage.setItem('db_pic_'+window.myPhone,url);}catch(err){}alert('Profile Photo Lag Gayi!');});e.target.value='';}
function editProfile(){let n=prompt('Naam:',window.myName);if(n){window.myName=n;localStorage.setItem('db_name_'+window.myPhone,n);}let b=prompt('Bio:',window.myBio);if(b){window.myBio=b;localStorage.setItem('db_bio_'+window.myPhone,b);}document.getElementById('myName').innerText=window.myName;document.getElementById('myName2').innerText=window.myName;document.getElementById('myBio').innerText=window.myBio;document.getElementById('myBio2').innerText=window.myBio;}
function addStory(e){let f=e.target.files[0];if(!f)return;if(f.type.includes('video')){let url=URL.createObjectURL(f);window.stories.unshift({src:url,type:'video'});renderStories();alert('Video Story Lag Gayi!');}else{compressImage(f,function(url){window.stories.unshift({src:url,type:'image'});try{localStorage.setItem('db_stories_'+window.myPhone,JSON.stringify(window.stories));}catch(err){}renderStories();alert('Story Lag Gayi!');});}e.target.value='';}
function renderStories(){let box=document.getElementById('storyList');if(window.stories.length==0){box.innerHTML='<p style="font-size:13px;color:#999">Abhi koi story nahi</p>';return;}box.innerHTML='';window.stories.forEach((s,i)=>{box.innerHTML+=`<div class="story" onclick="if(confirm('Delete karein?')){window.stories.splice(${i},1);localStorage.setItem('db_stories_'+window.myPhone,JSON.stringify(window.stories));renderStories();}">${s.type.includes('video')?`<video src="${s.src}" muted></video>`:`<img src="${s.src}">`}<p>Meri Story</p></div>`});}
let postImg='';
function previewPost(e){let f=e.target.files[0];if(!f)return;compressImage(f,function(url){postImg=url;let p=document.getElementById('postPreview');p.src=url;p.classList.remove('hidden');document.getElementById('postStatus').innerText='Photo lag gayi, ab Post Karo dabao';});e.target.value='';}
function addPost(){let t=document.getElementById('postText').value.trim();if(!t&&!postImg){alert('Kuch likho ya photo chuno');return;}window.posts.unshift({text:t,img:postImg,time:new Date().toLocaleString('hi-IN')});try{localStorage.setItem('db_posts_'+window.myPhone,JSON.stringify(window.posts));}catch(e){}document.getElementById('postText').value='';postImg='';document.getElementById('postPreview').classList.add('hidden');document.getElementById('postStatus').innerText='';renderPosts();alert('Post Ho Gayi!');}
function renderPosts(){let feed=document.getElementById('postFeed');if(!window.posts.length){feed.innerHTML='<div class="card" style="text-align:center;color:#999">Abhi koi post nahi</div>';return;}feed.innerHTML='';window.posts.forEach((p,i)=>{feed.innerHTML+=`<div class="card"><b>${window.myName}</b> • <span style="font-size:11px;color:#999">${p.time}</span><p style="margin:8px 0">${p.text}</p>${p.img?`<img class="post-img" src="${p.img}">`:''}<button class="btn2" style="margin-top:8px" onclick="window.posts.splice(${i},1);localStorage.setItem('db_posts_'+window.myPhone,JSON.stringify(window.posts));renderPosts();">Delete</button></div>`});}
function addReel(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);window.reels.unshift({src:url,text:prompt('Reel ka naam / caption likho')||'Meri Reel'});renderReels();alert('Reel Lag Gayi!');e.target.value='';}
function renderReels(){let feed=document.getElementById('reelFeed');if(!window.reels.length){feed.innerHTML='<div class="card" style="text-align:center;color:#999">Abhi koi reel nahi, upar se daalo</div>';return;}feed.innerHTML='';window.reels.forEach((r,i)=>{feed.innerHTML+=`<div class="reel"><video src="${r.src}" controls playsinline></video><div style="padding:10px"><b>${window.myName}</b> - ${r.text}</div></div>`});}
function addFriend(){let n=document.getElementById('newFriendName').value.trim();let c=document.getElementById('newFriendCity').value.trim()||'Jodhpur';if(!n){alert('Naam likho');return;}window.friends.unshift({name:n,city:c});localStorage.setItem('db_friends_'+window.myPhone,JSON.stringify(window.friends));document.getElementById('newFriendName').value='';document.getElementById('newFriendCity').value='';renderFriends();alert(n+' Jud Gaya!');}
function renderFriends(){let box=document.getElementById('friendList');document.getElementById('friendCount').innerText=window.friends.length;if(!window.friends.length){box.innerHTML='<p style="color:#888">Abhi koi dost nahi</p>';return;}box.innerHTML='';window.friends.forEach(f=>{box.innerHTML+=`<div class="friend"><img src="https://via.placeholder.com/150/FF3D68/fff?text=${f.name.charAt(0)}"><div style="flex:1"><b>${f.name}</b><br><span style="font-size:12px;color:#888">${f.city}</span></div><button class="btn2" onclick="alert('${f.name} ko Hi bola!')">Chat</button></div>`});}
function shareApp(){let link='https://sahilkhn45427-cloud.github.io/dostibook/';if(navigator.share){navigator.share({title:'DostiBook',url:link})}else{prompt('Link copy karo:',link)}}
startApp();
</script>
</body>
</html>
